# tx5-core = { path = "../tx5/crates/tx5-core" }
# tx5 = { path = "../tx5/crates/tx5" }
# --- ELOHIM: dead-peer zombie-PeerConnection leak fix (holochain/tx5 #194 + #199) ---
# Those fixes merged to tx5 `main` AFTER the v0.8.1 release, so the conductor's pinned tx5 0.8.1
# ships the leak (go_pion.rs ignored PeerConnectionState changes -> dead-peer ICE/DTLS/SCTP Go
# memory never freed -> monotonic off-heap OOM). Patch the whole tx5 0.8.1 family to our fork
# (../tx5, branch elohim-0.8.1-zombie-fix) so there is one consistent source for each tx5 crate.
# BUILD-VERIFY on a Go 1.24 + nix host (tx5-go-pion-sys is CGo); not verifiable in the dev container.
# See .claude/data/conductor-leak-rca-tx5-gopion-backpressure-2026-06-17.md
# --- ELOHIM: cross-relay preflight fix (kitsune2_transport_iroh 0.4.1) ---
# Upstream `IrohTransport::own_url_for_preflight` (src/lib.rs) fails CLOSED when
# a peer homes to a relay we do not home to, so two peers on different relays
# can never connect. The caller then reports it as "Connection attempted before
# home relay URL is known", which names a DIFFERENT condition (no local URL) and
# sent three separate investigations at the wrong seam.
#
# Wave-2 relay sovereignty (D2) homes each conductor to its own doorway's relay
# — doorway A -> relay.alpha.elohim.host, doorway B -> relay.elohim.host — and
# the design doc's own rationale states peers need not share a relay. That
# property is true of iroh and of the peer-URL encoding, but NOT of this
# function. The patch falls back to our global (home-relay) URL instead of
# refusing, and leaves `None` only for the genuinely address-less case.
#
# Vendored rather than submoduled: elohim/kitsune2 is pinned at v0.3.2, which
# predates the transport_iroh crate entirely. Source is the unmodified
# crates.io 0.4.1 tarball plus the marked ELOHIM PATCH hunks.
# Upstream-candidate: holochain/kitsune2.
kitsune2_transport_iroh = { path = "patches/kitsune2_transport_iroh" }
tx5 = { path = "../tx5/crates/tx5" }
tx5-connection = { path = "../tx5/crates/tx5-connection" }
tx5-core = { path = "../tx5/crates/tx5-core" }
tx5-go-pion = { path = "../tx5/crates/tx5-go-pion" }
tx5-go-pion-sys = { path = "../tx5/crates/tx5-go-pion-sys" }
tx5-signal = { path = "../tx5/crates/tx5-signal" }
